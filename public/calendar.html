<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Афиша — Календарь</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #EFEFF4; }
    button { cursor: pointer; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const { createApp, ref, computed } = Vue;

const MONTHS_RU  = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WEEKDAYS   = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];

const now = new Date();
const pad = n => String(n).padStart(2, "0");
const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;

const EVENTS_INIT = [
  { id:1, date:`${now.getFullYear()}-${pad(now.getMonth()+1)}-12`, title:"Ярмарка направлений", address:"ул. Павла Корчагина, 22 ДоброЦентр", t1:"17:00", t2:"19:00", status:"registered", mine:true  },
  { id:2, date:`${now.getFullYear()}-${pad(now.getMonth()+1)}-14`, title:"Ярмарка направлений", address:"ул. Павла Корчагина, 22 ДоброЦентр", t1:"17:00", t2:"19:00", status:"cancelled",  mine:false },
  { id:3, date:`${now.getFullYear()}-${pad(now.getMonth()+1)}-23`, title:"Ярмарка направлений", address:"ул. Павла Корчагина, 22 ДоброЦентр", t1:"17:00", t2:"19:00", status:"registered", mine:true  },
  { id:4, date:todayStr,                                           title:"Встреча волонтёров",  address:"ул. Ленина, 5 Центр занятости",       t1:"10:00", t2:"12:00", status:"registered", mine:true  },
];

createApp({
  setup() {
    const month   = ref(now.getMonth());
    const year    = ref(now.getFullYear());
    const tab     = ref("all");
    const search  = ref("");
    const reg     = ref(Object.fromEntries(EVENTS_INIT.map(e => [e.id, e.status === "registered"])));

    const tabs = [
      { id: "all",   label: "Все" },
      { id: "today", label: "Сегодня" },
      { id: "mine",  label: "Мои мероприятия" },
    ];

    function navigate(dir) {
      month.value += dir;
      if (month.value > 11) { month.value = 0;  year.value++; }
      if (month.value < 0)  { month.value = 11; year.value--; }
    }

    function toggleReg(id) {
      reg.value[id] = !reg.value[id];
    }

    function dayNum(d)    { return parseInt(d.split("-")[2], 10); }
    function monShort(d)  { return MONTHS_GEN[parseInt(d.split("-")[1],10)-1].slice(0,3); }
    function weekday(d)   { return WEEKDAYS[new Date(d+"T00:00:00").getDay()]; }

    const filtered = computed(() => {
      return EVENTS_INIT.filter(e => {
        const em = parseInt(e.date.split("-")[1],10) - 1;
        const ey = parseInt(e.date.split("-")[0],10);
        if (em !== month.value || ey !== year.value) return false;
        if (tab.value === "today" && e.date !== todayStr) return false;
        if (tab.value === "mine"  && !e.mine) return false;
        if (search.value && !e.title.toLowerCase().includes(search.value.toLowerCase())) return false;
        return true;
      });
    });

    const grouped = computed(() => {
      const map = {};
      filtered.value.forEach(e => { (map[e.date] = map[e.date] || []).push(e); });
      return Object.entries(map).sort(([a],[b]) => a.localeCompare(b));
    });

    const monthLabel = computed(() => `${MONTHS_RU[month.value]} ${year.value}`);
    const todayLabel = computed(() => `${now.getDate()} ${MONTHS_GEN[now.getMonth()]}`);

    return { month, year, tab, search, reg, tabs, navigate, toggleReg, dayNum, monShort, weekday, filtered, grouped, monthLabel, todayLabel, todayStr };
  },

  template: `
  <div style="display:flex; min-height:100vh;">

    <!-- Sidebar -->
    <aside style="width:144px;background:white;display:flex;flex-direction:column;padding:24px 16px;flex-shrink:0;border-right:1px solid #f3f4f6;">
      <div style="margin-bottom:36px;">
        <span style="font-size:18px;font-weight:700;letter-spacing:.1em;color:#111827;text-transform:uppercase;">Афиша</span>
      </div>
      <nav style="display:flex;flex-direction:column;gap:4px;">
        <button style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;text-align:left;width:100%;background:none;border:none;color:#9ca3af;font-family:inherit;" @mouseover="e=>e.target.closest('button').style.background='#f9fafb'" @mouseleave="e=>e.target.closest('button').style.background='none'">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Главная
        </button>
        <button style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;text-align:left;width:100%;background:#f5f3ff;border:none;color:#7c3aed;font-weight:600;font-family:inherit;">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Календарь
        </button>
      </nav>
      <div style="margin-top:auto;">
        <button style="display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;background:none;border:none;color:#9ca3af;font-family:inherit;">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Выход
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main style="flex:1;display:flex;flex-direction:column;min-width:0;">

      <!-- Header -->
      <div style="padding:24px 32px 0;">

        <!-- Search + Avatar -->
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="flex:1;position:relative;">
            <svg style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9ca3af;" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input
              v-model="search"
              type="text"
              placeholder="Поиск по событиям"
              style="width:100%;background:white;border:1px solid transparent;border-radius:9999px;padding:10px 16px 10px 38px;font-size:13px;color:#374151;box-shadow:0 1px 3px rgba(0,0,0,.06);font-family:inherit;outline:none;transition:border-color .15s;"
              @focus="e=>e.target.style.borderColor='#c4b5fd'"
              @blur="e=>e.target.style.borderColor='transparent'"
            />
          </div>
          <div style="width:36px;height:36px;border-radius:50%;background:#2D2D5E;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:600;flex-shrink:0;">АБ</div>
        </div>

        <!-- Month nav -->
        <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-top:20px;">
          <button @click="navigate(-1)" style="color:#9ca3af;background:none;border:none;display:flex;align-items:center;padding:4px;" @mouseover="e=>e.currentTarget.style.color='#374151'" @mouseleave="e=>e.currentTarget.style.color='#9ca3af'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span style="font-size:13px;font-weight:500;color:#374151;width:120px;text-align:center;">{{ monthLabel }}</span>
          <button @click="navigate(1)" style="color:#9ca3af;background:none;border:none;display:flex;align-items:center;padding:4px;" @mouseover="e=>e.currentTarget.style.color='#374151'" @mouseleave="e=>e.currentTarget.style.color='#9ca3af'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        <!-- Tabs -->
        <div style="display:flex;justify-content:center;margin-top:12px;border-bottom:1px solid #e5e7eb;">
          <button
            v-for="t in tabs"
            :key="t.id"
            @click="tab = t.id"
            style="position:relative;padding:6px 24px 10px;font-size:13px;background:none;border:none;font-family:inherit;transition:color .15s;"
            :style="tab === t.id ? {color:'#7c3aed', fontWeight:'600'} : {color:'#9ca3af'}"
          >
            {{ t.label }}
            <span v-if="tab === t.id" style="position:absolute;bottom:0;left:12px;right:12px;height:2px;background:#7c3aed;border-radius:9999px;"></span>
          </button>
        </div>
      </div>

      <!-- Content -->
      <div style="flex:1;padding:24px 32px;overflow:auto;">
        <div style="max-width:640px;">

          <!-- Empty state -->
          <div v-if="grouped.length === 0" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;">
            <p v-if="tab === 'today'" style="font-size:13px;color:#9ca3af;margin-bottom:16px;">Сегодня, {{ todayLabel }}</p>
            <p style="color:#a78bfa;font-size:15px;">У вас нет запланированных мероприятий</p>
          </div>

          <!-- Groups -->
          <div v-for="[dateStr, events] in grouped" :key="dateStr" style="margin-bottom:20px;">
            <h3 style="color:#8b5cf6;font-weight:600;font-size:15px;margin:0 0 12px;">{{ weekday(dateStr) }}</h3>

            <!-- Event cards -->
            <div v-for="e in events" :key="e.id"
              style="background:white;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px;">

              <!-- Date -->
              <div style="display:flex;flex-direction:column;align-items:center;width:40px;flex-shrink:0;">
                <span style="color:#7c3aed;font-size:30px;font-weight:700;line-height:1;">{{ dayNum(e.date) }}</span>
                <span style="color:#a78bfa;font-size:11px;margin-top:2px;">{{ monShort(e.date) }}</span>
              </div>

              <!-- Info -->
              <div style="flex:1;min-width:0;">
                <p style="margin:0;font-size:13px;font-weight:500;color:#1f2937;">{{ e.title }}</p>
                <p style="margin:3px 0 0;font-size:11px;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ e.address }}</p>
                <p style="margin:6px 0 0;font-size:11px;color:#8b5cf6;font-weight:500;">{{ e.t1 }} – {{ e.t2 }}</p>
              </div>

              <!-- Actions -->
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
                <span v-if="e.status === 'cancelled'" style="font-size:12px;border-radius:9999px;padding:3px 12px;background:#fff1f2;color:#f87171;">Отменено</span>
                <span v-else-if="reg[e.id]"          style="font-size:12px;border-radius:9999px;padding:3px 12px;background:#f0fdf4;color:#16a34a;">Вы записаны</span>

                <button
                  @click="toggleReg(e.id)"
                  :disabled="e.status === 'cancelled'"
                  style="font-size:12px;border-radius:9999px;padding:5px 16px;background:none;font-family:inherit;transition:border-color .15s, color .15s;"
                  :style="e.status === 'cancelled'
                    ? {border:'1px solid #e5e7eb', color:'#d1d5db', cursor:'not-allowed'}
                    : {border:'1px solid #d1d5db', color:'#6b7280'}"
                  @mouseover="e.status !== 'cancelled' && ($event.target.style.borderColor='#a78bfa', $event.target.style.color='#7c3aed')"
                  @mouseleave="e.status !== 'cancelled' && ($event.target.style.borderColor='#d1d5db', $event.target.style.color='#6b7280')"
                >
                  {{ reg[e.id] ? 'Отменить запись' : 'Записаться' }}
                </button>
              </div>

            </div>
          </div>

        </div>
      </div>
    </main>
  </div>
  `
}).mount("#app");
</script>
</body>
</html>
